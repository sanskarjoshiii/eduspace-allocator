name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # Dummy values: they only satisfy the env schema at build time. Nothing here is secret.
  MONGODB_URI: mongodb://127.0.0.1:27017/ci
  AUTH_SECRET: ci-dummy-auth-secret-0123456789abcdefghijklmn
  CRON_SECRET: ci-dummy-cron-secret-0123456789abcdefghijklmn
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    env:
      # mongodb-memory-server downloads this mongod build on Linux; cache it between runs.
      MONGOMS_VERSION: '8.0.12'
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}
      - run: npm ci
      # A failing test fails this job, and the required check blocks the PR.
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    needs: build
    # Pull requests and pushes to main only.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    continue-on-error: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_MONGODB_URI: mongodb://127.0.0.1:27017/eduspace_e2e
      ADMIN_SEED_EMAIL: admin@eduspace.local
      ADMIN_SEED_PASSWORD: Admin-Pass-2026
      # The seed step below already loaded the scenario; the Playwright global setup skips it.
      E2E_SKIP_SEED: '1'
      # The build step below produces .next; the web server only runs `next start`.
      PW_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          MONGODB_URI: ${{ env.E2E_MONGODB_URI }}
      - name: Seed the e2e scenario
        run: npm run seed -- --profile=e2e --reset
        env:
          MONGODB_URI: ${{ env.E2E_MONGODB_URI }}
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
